<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>人类学思想史 — 可视化的观点地图</title>
<meta name="description" content="一个互动式的人类学史总览：以时间线与关系图谱呈现学者、观点及彼此之间的继承与分歧。">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="人类学思想史 — 可视化的观点地图">
<meta property="og:description" content="59 位学者、141 条观点、114 组关系：把人类学百年理论脉络压缩成一张可以自由浏览的地图。含观点时间线、人物时间线、人物图谱与田野地图。">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="人类学思想史 — 可视化的观点地图">
<meta name="twitter:description" content="观点时间线 · 人物时间线 · 人物图谱 · 田野地图">
<meta name="twitter:image" content="assets/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2300aeac'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<canvas id="stage"></canvas>

<!-- 左上浮动工具栏 -->
<div id="leftToolbar">
  <div id="zoominButton" class="toolbar-btn" title="放大">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
  </div>
  <div id="zoomoutButton" class="toolbar-btn" title="缩小">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </div>
  <div id="fitToScreenButton" class="toolbar-btn" title="适应屏幕">
    <svg class="icon" viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path d="M9 20H4v-5"/></svg>
  </div>
  <div id="darkModeToggleBtn" class="toolbar-btn" title="深色模式">
    <svg class="icon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </div>
</div>

<!-- 右上控制条 -->
<div id="topControlBar">
  <div class="topbar-search-container">
    <svg class="icon search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
    <input id="search" type="text" placeholder="搜索人物、观点、关键词…" autocomplete="off">
    <div id="clearSearchBtn" class="clear-search-filter-icon" title="清空搜索" style="display:none;">
      <svg class="icon" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </div>
    <div id="searchResultContainer"><div class="list"></div></div>
  </div>

  <div id="viewSelector" class="topbar-dropdown">
    <div class="selected-view">
      <span class="view-icon" data-icon="st"></span>
      <span class="text">观点时间线</span>
      <svg class="icon chevron" viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
    </div>
    <div class="dropdown-options">
      <div class="dropdown-item" data-view="st">
        <span class="view-icon" data-icon="st"></span><span class="text">观点时间线</span>
      </div>
      <div class="dropdown-item" data-view="pt">
        <span class="view-icon" data-icon="pt"></span><span class="text">人物时间线</span>
      </div>
      <div class="dropdown-item" data-view="pg">
        <span class="view-icon" data-icon="pg"></span><span class="text">人物图谱</span>
      </div>
      <div class="dropdown-item" data-view="mp">
        <span class="view-icon" data-icon="mp"></span><span class="text">田野地图</span>
      </div>
      <div class="dropdown-item" data-view="ix">
        <span class="view-icon" data-icon="ix"></span><span class="text">观点索引</span>
      </div>
    </div>
  </div>

  <button id="aboutBtn" class="topbar-btn icon-btn" title="关于">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></svg>
  </button>
</div>

<!-- 左下：筛选 + 标题 -->
<div id="header">
  <div id="filter" class="filter-container">
    <div id="auxActions">
      <button id="clearFocusBtn" class="drawer-btn" hidden>
        <svg class="icon" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>清除聚焦
      </button>
      <button id="resetFiltersBtn" class="drawer-btn" hidden>
        <svg class="icon" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>重置筛选
      </button>
    </div>

    <div class="filter-pills-group" id="basicsPills"></div>
    <div class="filter-pills-group" id="branchPills"></div>
    <div class="filter-pills-group" id="periodPills"></div>
    <div class="filter-pills-group" id="edgePills"></div>
  </div>

  <div id="headertitle-wrap">
    <div id="headeroverline">HISTORY OF ANTHROPOLOGY</div>
    <div id="headertitle">人类学思想史</div>
    <div id="headersubtitle">summarized &amp; visualized · 观点、人物与争论的可视化地图</div>
    <div id="headerinfo">work in progress v0.4 · 2026.09.30 · 90 位学者 347 条观点 · 默认按「要点」显示（每位学者 2–3 条）· 单击时期只看该时期 · 悬停句子高亮相关连线</div>
  </div>
</div>

<!-- 右下：视图说明 + 统计 -->
<div id="viewHint"></div>
<div id="indexPanel" hidden></div>
<div id="statsBar"><span id="statsText"></span></div>

<div id="footerShade"></div>
<div id="tooltip" class="tooltip" hidden></div>

<!-- 右侧详情抽屉 -->
<aside id="drawer" class="drawer" hidden>
  <div id="drawerInner" class="drawer-inner"></div>
</aside>

<script src="js/worldmap.js"></script>
<script src="js/data.js"></script>
<script src="js/meta.js"></script>
<script src="js/app.js"></script>
</body>
</html>
